<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AEX Beleggingsgame">
<meta name="application-name" content="AEX Beleggingsgame">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1b3a">
<title>AEX Beleggingsgame</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f8fb; --border:#e3e7ef;
  --text:#0f172a; --muted:#5b6476; --brand:#0b1b3a; --accent:#2563eb; --accent-soft:#e0eaff;
  --pos:#0f8a4b; --pos-soft:#dcf5e7; --neg:#c62828; --neg-soft:#fde4e4; --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --radius:16px; --tabbar-h:64px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --surface:#121a2b; --surface-2:#172136; --border:#24304a;
    --text:#e8edf7; --muted:#9aa6bd; --brand:#0b1b3a; --accent:#5b8cff; --accent-soft:#1b2a4d;
    --pos:#34d399; --pos-soft:#0f2e22; --neg:#f87171; --neg-soft:#3a1717; --warn:#fbbf24; --warn-soft:#3a2c0a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Header ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(var(--safe-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.appbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.appbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;flex:1 1 auto;min-width:160px}
.appbar h1 small{display:block;font-weight:500;font-size:12.5px;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill-open{background:#0f8a4b33;color:#6ee7a8}
.pill-closed{background:#ffffff1f;color:#cbd5e1}
.pill-live{background:#2563eb40;color:#bcd2ff}
.pill-sim{background:#b4530940;color:#fcd34d}
.pill-cache{background:#ffffff1f;color:#e2e8f0}
.appbar-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;opacity:.9}
.btn-refresh{min-height:44px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:12px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn-refresh:active{background:#ffffff2a}
.btn-refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Layout ---------- */
main{padding:16px max(16px,env(safe-area-inset-right)) calc(var(--tabbar-h) + var(--safe-bottom) + 24px) max(16px,env(safe-area-inset-left));max-width:1200px;margin:0 auto}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{grid-template-columns:1fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px;margin:16px 0 8px}
.section-title{font-size:22px;font-weight:700;margin:4px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi .label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;min-height:44px}
.kpi .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:-6px}
.kpi .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.big{grid-column:span 2;background:linear-gradient(135deg,#0b1b3a,#1e3a8a);color:#fff;border:none}
.kpi.big .label,.kpi.big .sub{color:#c7d2fe}
.kpi.big .value{font-size:32px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.kpi.big .pos{color:#86efac}.kpi.big .neg{color:#fca5a5}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.neutral{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.ok{background:var(--pos-soft);color:var(--pos)}
.banner b{color:inherit}
.banner .grow{flex:1}

/* info-icoon */
.i-btn{min-width:44px;min-height:44px;margin:-12px -10px -12px -6px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.i-btn span{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;font-weight:700;font-style:italic;font-family:Georgia,serif;display:inline-flex;align-items:center;justify-content:center;opacity:.75}

/* tabel */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
.motivation{font-size:13px;color:var(--muted);max-width:340px;min-width:180px}

/* knoppen */
.btn{min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.buy{background:var(--pos);border-color:var(--pos);color:#fff}
.btn.sell{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* beurslijst */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:16px}
.select{min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 12px;font-size:16px;flex:0 1 260px}
.stock-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
@media (max-width:460px){.stock-list{grid-template-columns:1fr}.stock .btn{padding:0 12px}}
.stock{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;color:#fff;flex:0 0 auto;letter-spacing:.3px}
.stock .meta{flex:1;min-width:0}
.stock .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock .tick{font-size:12.5px;color:var(--muted)}
.stock .px{text-align:right;font-variant-numeric:tabular-nums}
.stock .px .p{font-weight:700}
.stock .px .c{font-size:13px;font-weight:600}
.stock .actions{display:flex;flex-direction:column;gap:6px}
.link-btn{border:none;background:none;padding:0;text-align:left;min-height:44px;display:block;width:100%}
.chip{display:inline-block;white-space:nowrap;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);margin-top:2px}
.held{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + var(--safe-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center}
.tabbar-inner{display:flex;width:100%;max-width:820px}
.tab{flex:1;min-height:52px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--accent);background:var(--accent-soft)}

/* modals */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--safe-bottom));box-shadow:0 20px 50px rgba(0,0,0,.3)}
@media (min-width:700px){.modal{border-radius:20px}}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:20px;flex:1}
.close-x{width:44px;height:44px;border-radius:50%;border:none;background:var(--surface-2);font-size:22px;line-height:1;flex:0 0 auto}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:none;border-radius:9px;background:transparent;font-weight:700}
.seg button.on-buy{background:var(--pos);color:#fff}
.seg button.on-sell{background:var(--neg);color:#fff}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:24px;font-weight:700}
.qty input{flex:1;min-width:0;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.calc{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:14px 0;font-variant-numeric:tabular-nums}
.calc .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.calc .row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
textarea{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:12px;font-size:16px;resize:vertical}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input.f{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:16px}
.err{color:var(--neg);font-size:13.5px;margin-top:6px;min-height:18px}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.counter{font-size:12.5px;color:var(--muted);text-align:right;margin-top:4px}
.company-block{margin:12px 0}
.company-block h4{margin:0 0 4px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.company-block p{margin:0}
.company-card{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 18px);z-index:60;background:#0f172a;color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.chart-box{position:relative;height:300px}
.pie-box{position:relative;height:260px}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress > div{height:100%;background:linear-gradient(90deg,#2563eb,#22c55e)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* rapport */
.report h1{font-size:22px;margin:0 0 4px}
.report h3{margin:18px 0 6px;font-size:16px}
.report table{font-size:13px}
.report .chart-img{width:100%;border:1px solid var(--border);border-radius:12px;margin-top:8px}

@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;padding:0;background:#fff;color:#000}
  .no-print{display:none!important}
}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-row">
    <h1>AEX Beleggingsgame<small id="hdrPlayer">&nbsp;</small></h1>
    <span id="marketPill" class="pill pill-closed"><span class="dot"></span><span>Beurs …</span></span>
    <span id="dataPill" class="pill pill-sim"><span class="dot"></span><span>Simulatiemodus</span></span>
  </div>
  <div class="appbar-sub">
    <span id="dayLabel"></span>
    <span>·</span>
    <span id="lastUpdate">Nog geen koersen</span>
    <span style="flex:1"></span>
    <button id="refreshBtn" class="btn-refresh" aria-label="Koersen verversen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      Koersen verversen
    </button>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar">
  <div class="tabbar-inner" id="tabbar">
    <button class="tab active" data-tab="portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Portefeuille</button>
    <button class="tab" data-tab="market">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l5-5 5 5"/><path d="M7 11l5-5 5 5"/></svg>AEX-beurs</button>
    <button class="tab" data-tab="companies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h8l6 6v12"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h6"/></svg>Bedrijven</button>
    <button class="tab" data-tab="transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>Transacties</button>
    <button class="tab" data-tab="export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Inleveren</button>
  </div>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
/* =====================================================================
   CONFIGURATIE  –  pas hier alles aan wat je als docent wilt wijzigen
   ===================================================================== */

// URL van je Google Apps Script web-app (zie stappenplan). Leeg = simulatiemodus.
const DATA_ENDPOINT_URL = "";

// true  = buiten beurstijd worden orders "lopend" en pas bij opening uitgevoerd
// false = buiten beurstijd direct uitgevoerd tegen de laatste slotkoers
const STRICT_EURONEXT_HOURS = true;

const START_CAPITAL      = 10000.00;  // startkapitaal in euro
const COST_FIXED         = 2.00;      // vaste transactiekosten per order (€)
const COST_PERCENT       = 0.10;      // variabele kosten in % van de orderwaarde
const GAME_DAYS          = 30;        // lengte van de PO in kalenderdagen
const MIN_MOTIVATION     = 10;        // minimaal aantal tekens motivatie
const REFRESH_INTERVAL_MIN = 60;      // automatisch verversen (minuten)
const PENDING_RESERVE_BUFFER = 0.05;  // extra cash geblokkeerd bij lopende kooporders (koers kan stijgen)
const PENDING_EXEC_DELAY_MIN = 20;    // lopende orders pas X min na opening uitvoeren (gratis koersen lopen ~15-20 min achter)

// Optioneel: vaste startdatum voor de hele klas (bijv. "2026-11-23"). null = dag van onboarding.
const FIXED_START_DATE = null;

// Index die als benchmark dient
const AEX_INDEX = { ticker: "^AEX", gf: "INDEXEURO:AEX", name: "AEX-index", sim: 950 };

// Alle fondsen in de AEX (stand 30-09-2026, bron: Euronext). Aanpasbaar bij een indexherziening.
// ticker = Euronext/Yahoo-notatie, gf = Google Finance-code (voor het Apps Script), sim = startkoers simulatie
const AEX_STOCKS = [
  { ticker:"AALB.AS",  gf:"AMS:AALB",  name:"Aalberts",             sector:"Industrie",                  sim:30,   color:"#475569" },
  { ticker:"ABN.AS",   gf:"AMS:ABN",   name:"ABN AMRO",             sector:"Financiële dienstverlening", sim:27,   color:"#0f766e" },
  { ticker:"ADYEN.AS", gf:"AMS:ADYEN", name:"Adyen",                sector:"Technologie",                sim:1450, color:"#0abf53" },
  { ticker:"AGN.AS",   gf:"AMS:AGN",   name:"Aegon",                sector:"Financiële dienstverlening", sim:6.8,  color:"#1d4ed8" },
  { ticker:"AD.AS",    gf:"AMS:AD",    name:"Ahold Delhaize",       sector:"Consumentengoederen",        sim:35,   color:"#00a0e2" },
  { ticker:"AKZA.AS",  gf:"AMS:AKZA",  name:"AkzoNobel",            sector:"Grondstoffen & chemie",      sim:58,   color:"#1e3a8a" },
  { ticker:"MT.AS",    gf:"AMS:MT",    name:"ArcelorMittal",        sector:"Grondstoffen & chemie",      sim:33,   color:"#e4572e" },
  { ticker:"ASM.AS",   gf:"AMS:ASM",   name:"ASM International",    sector:"Technologie",                sim:520,  color:"#be123c" },
  { ticker:"ASML.AS",  gf:"AMS:ASML",  name:"ASML",                 sector:"Technologie",                sim:950,  color:"#10069f" },
  { ticker:"ASRNL.AS", gf:"AMS:ASRNL", name:"a.s.r.",               sector:"Financiële dienstverlening", sim:58,   color:"#7c3aed" },
  { ticker:"BESI.AS",  gf:"AMS:BESI",  name:"BE Semiconductor (Besi)", sector:"Technologie",             sim:130,  color:"#0369a1" },
  { ticker:"CVC.AS",   gf:"AMS:CVC",   name:"CVC Capital Partners", sector:"Financiële dienstverlening", sim:17,   color:"#334155" },
  { ticker:"DSFIR.AS", gf:"AMS:DSFIR", name:"DSM-Firmenich",        sector:"Consumentengoederen",        sim:75,   color:"#0e7490" },
  { ticker:"EXO.AS",   gf:"AMS:EXO",   name:"Exor",                 sector:"Financiële dienstverlening", sim:85,   color:"#1f2937" },
  { ticker:"HEIA.AS",  gf:"AMS:HEIA",  name:"Heineken",             sector:"Consumentengoederen",        sim:70,   color:"#15803d" },
  { ticker:"IMCD.AS",  gf:"AMS:IMCD",  name:"IMCD",                 sector:"Grondstoffen & chemie",      sim:85,   color:"#0891b2" },
  { ticker:"INGA.AS",  gf:"AMS:INGA",  name:"ING Groep",            sector:"Financiële dienstverlening", sim:22,   color:"#ff6200" },
  { ticker:"KPN.AS",   gf:"AMS:KPN",   name:"KPN",                  sector:"Telecom",                    sim:4.1,  color:"#009900" },

const fmtNum = (n, d=2) => new Intl.NumberFormat('nl-NL', { minimumFractionDigits:d, maximumFractionDigits:d }).format(isFinite(n) ? n : 0);

const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Tijd in Amsterdam ---------- */
const amsFmt = new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Amsterdam', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', weekday:'short', hour12:false });
function ams(d = new Date()){
  const p = {}; amsFmt.formatToParts(d).forEach(x => p[x.type] = x.value);
  const dowMap = { Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6, Sun:0 };
  const hh = +p.hour % 24;
  return { y:+p.year, m:+p.month, d:+p.day, hh, mm:+p.minute, dow:dowMap[p.weekday], key:`${p.year}-${p.month}-${p.day}`, min: hh*60 + (+p.minute) };
}
const fmtDateTime = ts => new Date(ts).toLocaleString('nl-NL', { timeZone:'Europe/Amsterdam', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtDate = ts => new Date(ts).toLocaleDateString('nl-NL', { timeZone:'Europe/Amsterdam', day:'2-digit', month:'2-digit', year:'numeric' });
const fmtKey = key => { const [y,m,d] = key.split('-'); return `${d}-${m}-${y}`; };
function daysBetweenKeys(a, b){ const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000); }
function addDaysKey(key, n){ const [y,m,d] = key.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }

/* ---------- Euronext-handelskalender ---------- */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`; }
function holidays(y){ const e = easter(y); return new Set([`${y}-01-01`, addDaysKey(e,-2), addDaysKey(e,1), `${y}-05-01`, `${y}-12-25`, `${y}-12-26`]); }
function isTradingDay(key){ const [y,m,d] = key.split('-').map(Number); const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return dow>=1 && dow<=5 && !holidays(y).has(key); }
function closeMinute(key){ return (key.endsWith('-12-24') || key.endsWith('-12-31')) ? 14*60+5 : 17*60+30; }
const OPEN_MIN = 9*60;
function marketState(now = new Date()){
  const a = ams(now);
  const trading = isTradingDay(a.key);
  const close = closeMinute(a.key);
  const open = trading && a.min >= OPEN_MIN && a.min < close;
  let next = null;
  if (!open){
    let k = a.key;
    if (trading && a.min < OPEN_MIN) next = k;
    else { for (let i=1;i<15;i++){ k = addDaysKey(a.key,i); if (isTradingDay(k)){ next = k; break; } } }
  }
  const dayNames = ['zo','ma','di','wo','do','vr','za'];
  let detail;
  if (open){ detail = `sluit om ${String(Math.floor(close/60)).padStart(2,'0')}:${String(close%60).padStart(2,'0')}`; }
  else if (next){ const [y,m,d] = next.split('-').map(Number); const dn = dayNames[new Date(Date.UTC(y,m-1,d)).getUTCDay()]; detail = next===a.key ? 'opent om 09:00' : `opent ${dn} ${d}-${m} om 09:00`; }
  return { open, detail, key:a.key, min:a.min, trading, close };
}

/* =====================================================================
   STATE
   ===================================================================== */
let S = null;
function defaultState(){
  return { version:1, player:null, cash:START_CAPITAL, positions:{}, transactions:[], pending:[],
    prices:{}, index:null, source:'sim', lastUpdate:null, quoteTime:null, lastRefreshWasOpen:false,
    bench:{ value:START_CAPITAL, lastIdx:null, lastSrc:null }, snapshots:[], realized:0, totalCosts:0,
    frozen:null, sim:{ lastTs:null, dayKey:null }, liveCount:0 };
}
function load(){
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw){ const s = JSON.parse(raw); return Object.assign(defaultState(), s); } } catch(e){ console.warn(e); }
  return defaultState();
}
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch(e){ toast('Opslaan mislukt: ' + e.message); } }

function priceOf(t){ return S.prices[t]?.price ?? stockBy(t)?.sim ?? 0; }
function reservedCash(){ return round2(S.pending.filter(o => o.side==='buy').reduce((a,o) => a + o.reserve, 0)); }
function freeCash(){ return round2(S.cash - reservedCash()); }
function pendingSellQty(t){ return S.pending.filter(o => o.side==='sell' && o.ticker===t).reduce((a,o) => a + o.qty, 0); }

function gameDay(){
  if (!S.player) return 0;
  return daysBetweenKeys(S.player.startDate, ams().key) + 1;
}
function gameWeek(){ return Math.max(1, Math.ceil(Math.max(1, gameDay()) / 7)); }

function compute(){
  const pos = [];
  let stockValue = 0, unrealized = 0;
  for (const [t, p] of Object.entries(S.positions)){
    if (!p || p.qty <= 0) continue;
    const s = stockBy(t) || { name:t, sector:'Overig', color:'#64748b' };
    const price = priceOf(t);
    const value = p.qty * price;
    const unr = (price - p.avg) * p.qty;
    stockValue += value; unrealized += unr;
    pos.push({ ticker:t, name:s.name, sector:s.sector, color:s.color, qty:p.qty, avg:p.avg, price, value, unr, unrPct: p.avg ? (price/p.avg - 1)*100 : 0, change:S.prices[t]?.changePct ?? 0 });
  }
  pos.sort((a,b) => b.value - a.value);
  const total = S.cash + stockValue;
  const ret = total - START_CAPITAL;
  const retPct = ret / START_CAPITAL * 100;
  const today = ams().key;
  const prev = [...S.snapshots].filter(x => x.date < today).pop();
  const dayRes = total - (prev ? prev.value : START_CAPITAL);
  const benchValue = S.bench.value;
  const benchPct = (benchValue / START_CAPITAL - 1) * 100;
  const sectors = {};
  pos.forEach(p => sectors[p.sector] = (sectors[p.sector] || 0) + p.value);
  return { pos, stockValue, total, ret, retPct, dayRes, unrealized, realized:S.realized, costs:S.totalCosts, benchValue, benchPct, diffPP: retPct - benchPct, sectors, cashFree:freeCash(), reserved:reservedCash() };
}

/* =====================================================================
   KOERSEN: live ophalen of simuleren
   ===================================================================== */
function randn(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function simulate(now = new Date()){
  const ms = marketState(now);
  // initialiseren
  if (!S.index || S.source !== 'sim' && !Object.keys(S.prices).length){
    S.index = { price:AEX_INDEX.sim, prevClose:AEX_INDEX.sim, changePct:0 };
  }
  AEX_STOCKS.forEach(s => { if (!S.prices[s.ticker]) S.prices[s.ticker] = { price:s.sim, prevClose:s.sim, changePct:0 }; });
  if (!S.index) S.index = { price:AEX_INDEX.sim, prevClose:AEX_INDEX.sim, changePct:0 };
  const last = S.sim.lastTs ? new Date(S.sim.lastTs) : null;
  if (ms.open){
    let minutes;
    const newDay = S.sim.dayKey !== ms.key;
    if (newDay){
      // nieuwe handelsdag: slotkoers van gisteren wordt referentie, plus een openingsgat
      S.index.prevClose = S.index.price;
      AEX_STOCKS.forEach(s => S.prices[s.ticker].prevClose = S.prices[s.ticker].price);
      minutes = (ms.min - OPEN_MIN) + 120; // 'overnachtingseffect' telt als extra beweging
      S.sim.dayKey = ms.key;
    } else {
      minutes = Math.max(0, (now - last) / 60000);
    }
    minutes = Math.min(minutes, 900);
    const dt = minutes / 510;                 // fractie van een handelsdag
    const m = randn() * 0.011 * Math.sqrt(dt) + 0.0002 * dt;   // marktbeweging
    S.index.price *= Math.exp(m);
    AEX_STOCKS.forEach(s => {
      const beta = s.sector === 'Technologie' ? 1.3 : (s.sector === 'Consumentengoederen' || s.sector === 'Telecom') ? 0.6 : 1.0;
      const idio = randn() * 0.013 * Math.sqrt(dt);
      const p = S.prices[s.ticker];
      p.price = Math.max(0.5, p.price * Math.exp(beta * m + idio));
    });
  }
  AEX_STOCKS.forEach(s => { const p = S.prices[s.ticker]; p.price = Math.round(p.price * (p.price < 10 ? 1000 : 100)) / (p.price < 10 ? 1000 : 100); p.changePct = (p.price / p.prevClose - 1) * 100; });
  S.index.price = round2(S.index.price); S.index.changePct = (S.index.price / S.index.prevClose - 1) * 100;
  S.sim.lastTs = now.toISOString();
}

async function fetchLive(){
  if (!DATA_ENDPOINT_URL) throw new Error('Geen DATA_ENDPOINT_URL ingesteld');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const url = DATA_ENDPOINT_URL + (DATA_ENDPOINT_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
    const res = await fetch(url, { signal:ctrl.signal, redirect:'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !data.quotes) throw new Error('Onverwacht antwoord');
    return data;
  } finally { clearTimeout(timer); }
}

function applyLive(data){
  let ok = 0, latest = null;
  AEX_STOCKS.forEach(s => {
    const q = data.quotes[s.ticker];
    const price = q && Number(q.price);
    if (price && isFinite(price) && price > 0){
      const prevClose = Number(q.prevClose) > 0 ? Number(q.prevClose) : (S.prices[s.ticker]?.prevClose || price);
      const changePct = isFinite(Number(q.changePct)) && q.changePct !== null && q.changePct !== '' ? Number(q.changePct) : (price / prevClose - 1) * 100;
      S.prices[s.ticker] = { price, prevClose, changePct, live:true, tradeTime:q.tradeTime || null };
      ok++;
      if (q.tradeTime && (!latest || q.tradeTime > latest)) latest = q.tradeTime;
    } else if (S.prices[s.ticker]) {
      S.prices[s.ticker].live = false;
    } else {
      S.prices[s.ticker] = { price:s.sim, prevClose:s.sim, changePct:0, live:false };
    }
  });
  const iq = data.index;
  if (iq && Number(iq.price) > 0){
    const price = Number(iq.price);
    const prevClose = Number(iq.prevClose) > 0 ? Number(iq.prevClose) : price;
    S.index = { price, prevClose, changePct: isFinite(Number(iq.changePct)) && iq.changePct !== null && iq.changePct !== '' ? Number(iq.changePct) : (price/prevClose-1)*100 };
  }
  S.quoteTime = latest;
  return ok;
}

let refreshing = false;
async function refreshPrices(manual = false){
  if (refreshing) return;
  refreshing = true;
  $('#refreshBtn').classList.add('spin');
  const now = new Date();
  let src = 'sim';
  try {
    if (DATA_ENDPOINT_URL){
      const data = await fetchLive();
      const ok = applyLive(data);
      if (ok < AEX_STOCKS.length / 2) throw new Error('Te weinig koersen ontvangen (' + ok + ')');
      src = 'live';
      S.liveCount++;
    } else {
      simulate(now);
    }
  } catch(e){
    console.warn('Live koersen niet beschikbaar:', e);
    if (Object.keys(S.prices).length && S.source !== 'sim' && S.liveCount > 0){
      src = 'cache';  // laatst bekende live koersen blijven staan
    } else { simulate(now); src = 'sim'; }
    if (manual) toast(DATA_ENDPOINT_URL ? 'Koppeling niet bereikbaar – laatst bekende koersen gebruikt' : 'Simulatiemodus: er is nog geen koersenkoppeling ingesteld');
  }
  // benchmark doorrekenen (keten-index: geen sprong bij wisseling van bron)
  const effSrc = src === 'cache' ? 'live' : src;
  if (S.index && S.index.price > 0){
    if (S.bench.lastIdx && S.bench.lastSrc === effSrc){ S.bench.value = S.bench.value * (S.index.price / S.bench.lastIdx); }
    S.bench.lastIdx = S.index.price; S.bench.lastSrc = effSrc;
  }
  S.source = src;
  S.lastUpdate = now.toISOString();
  const ms = marketState(now);
  S.lastRefreshWasOpen = ms.open;
  executePending();
  checkFreeze();
  updateSnapshot();
  save();
  refreshing = false;
  $('#refreshBtn').classList.remove('spin');
  render();
  if (manual && src !== 'sim' && src !== 'cache') toast('Koersen ververst');
}

/* ---------- Snapshots (grafiek) ---------- */
function updateSnapshot(){
  if (!S.player) return;
  const c = compute();
  const key = ams().key;
  const snap = { date:key, value:round2(c.total), bench:round2(S.bench.value), aex:S.index?.price ?? null };
  const i = S.snapshots.findIndex(x => x.date === key);
  if (i >= 0) S.snapshots[i] = snap; else S.snapshots.push(snap);
  S.snapshots.sort((a,b) => a.date < b.date ? -1 : 1);
}

/* =====================================================================
   ORDERS
   ===================================================================== */
function executionAllowedNow(){
  const ms = marketState();
  if (!ms.open) return false;
  return true;
}
function pendingExecutableNow(){
  const ms = marketState();
  return ms.open && ms.min >= OPEN_MIN + (DATA_ENDPOINT_URL ? PENDING_EXEC_DELAY_MIN : 0);
}

function doBuy(t, qty, price, motivation, note){
  const value = round2(qty * price), costs = costFor(value), total = round2(value + costs);
  const p = S.positions[t] || { qty:0, avg:0 };
  const newQty = p.qty + qty;
  p.avg = (p.avg * p.qty + price * qty) / newQty; p.qty = newQty;
  S.positions[t] = p;
  S.cash = round2(S.cash - total);
  S.totalCosts = round2(S.totalCosts + costs);
  const s = stockBy(t);
  const tx = { id:uid(), ts:new Date().toISOString(), type:'Koop', ticker:t, name:s?.name || t, qty, price, value, costs, net:-total, realized:0, motivation, note:note||'' };
  S.transactions.push(tx); return tx;
}
function doSell(t, qty, price, motivation, note){
  const p = S.positions[t];
  const value = round2(qty * price), costs = costFor(value), net = round2(value - costs);
  const realized = round2((price - p.avg) * qty);
  p.qty -= qty; if (p.qty <= 0) delete S.positions[t];
  S.cash = round2(S.cash + net);
  S.realized = round2(S.realized + realized);
  S.totalCosts = round2(S.totalCosts + costs);
  const s = stockBy(t);
  const tx = { id:uid(), ts:new Date().toISOString(), type:'Verkoop', ticker:t, name:s?.name || t, qty, price, value, costs, net, realized, motivation, note:note||'' };
  S.transactions.push(tx); return tx;
}

function executePending(){
  if (!S.pending.length || !pendingExecutableNow()) return;
  const done = [];
  const list = [...S.pending].sort((a,b) => a.ts < b.ts ? -1 : 1);
  for (const o of list){
    if (S.source !== 'sim' && S.prices[o.ticker]?.live === false) continue; // wachten op echte koers
    S.pending = S.pending.filter(x => x.id !== o.id); // eerst uit lijst (reservering vrijgeven)
    const price = priceOf(o.ticker);
    if (o.side === 'buy'){
      let qty = o.qty;
      const avail = freeCash();
      while (qty > 0 && round2(qty*price) + costFor(qty*price) > avail) qty--;
      if (qty <= 0){ done.push(`Kooporder ${o.name} geannuleerd: onvoldoende saldo`); continue; }
      doBuy(o.ticker, qty, price, o.motivation, 'Lopende order uitgevoerd bij beursopening' + (qty < o.qty ? ` (aantal verlaagd van ${o.qty} naar ${qty} wegens saldo)` : ''));
      done.push(`Koop ${qty}× ${o.name} uitgevoerd à ${fmtEUR(price)}`);
    } else {
      const have = (S.positions[o.ticker]?.qty || 0) - pendingSellQty(o.ticker);
      const qty = Math.min(o.qty, have);
      if (qty <= 0){ done.push(`Verkooporder ${o.name} geannuleerd: geen aandelen`); continue; }
      doSell(o.ticker, qty, price, o.motivation, 'Lopende order uitgevoerd bij beursopening');
      done.push(`Verkoop ${qty}× ${o.name} uitgevoerd à ${fmtEUR(price)}`);
    }
  }
  if (done.length) setTimeout(() => showMessage('Lopende orders uitgevoerd', '<ul>' + done.map(d => `<li>${escapeHtml(d)}</li>`).join('') + '</ul>'), 300);
}

/* =====================================================================
   DAG 30: BEVROREN PO-EINDSTAND
   ===================================================================== */
function checkFreeze(){
  if (!S.player || S.frozen) return;
  const day = gameDay();
  const ms = marketState();
  const endKey = addDaysKey(S.player.startDate, GAME_DAYS - 1);
  if (day > GAME_DAYS || (day === GAME_DAYS && ms.min >= 17*60+35)){
    updateSnapshot();
    const c = compute();
    S.frozen = {
      frozenAt:new Date().toISOString(), endDate:endKey, lateFreeze: day > GAME_DAYS + 1,
      total:round2(c.total), cash:round2(S.cash), stockValue:round2(c.stockValue), ret:round2(c.ret), retPct:c.retPct,
      benchValue:round2(c.benchValue), benchPct:c.benchPct, diffPP:c.diffPP, realized:round2(c.realized), unrealized:round2(c.unrealized),
      costs:round2(c.costs), sectors:c.sectors, positions:c.pos.map(p => ({...p})),
      transactions:JSON.parse(JSON.stringify(S.transactions)), pending:JSON.parse(JSON.stringify(S.pending)),
      snapshots:S.snapshots.filter(x => x.date <= endKey).map(x => ({...x})), source:S.source, txCount:S.transactions.length
    };
    save();
    setTimeout(() => showMessage('🎉 PO-eindstand vastgelegd', `<p>Dag ${GAME_DAYS} is voorbij. Je eindstand voor het PO-verslag is <b>bevroren</b> opgeslagen: ${fmtEUR(S.frozen.total)} (${fmtPct(S.frozen.retPct)}).</p><p>Je vindt hem bij <b>Inleveren</b>. Je mag vrijwillig doorspelen; de bevroren eindstand verandert dan niet meer.</p>`), 400);
  }
}

function chartColors(){
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  return { grid: dark ? '#24304a' : '#e3e7ef', text: dark ? '#9aa6bd' : '#5b6476', port: dark ? '#5b8cff' : '#2563eb', bench: dark ? '#fbbf24' : '#d97706', border: dark ? '#121a2b' : '#ffffff' };
}
const SECTOR_COLORS = { 'Technologie':'#2563eb','Financiële dienstverlening':'#0f766e','Consumentengoederen':'#16a34a','Energie':'#d97706','Grondstoffen & chemie':'#7c3aed','Industrie':'#475569','Zakelijke informatie':'#ea580c','Gezondheidszorg':'#0891b2','Telecom':'#65a30d','Media & entertainment':'#db2777','Vastgoed':'#b91c1c','Cash':'#94a3b8','Overig':'#64748b' };

function seriesFrom(snaps, startKey){
  const pts = [{ date:startKey, label:'Start', value:START_CAPITAL, bench:START_CAPITAL }];
  snaps.forEach(s => { if (s.date >= startKey) pts.push(s); });
  return pts;
}

function lineChartConfig(snaps, startKey, forPdf=false){
  const col = forPdf ? { grid:'#e5e7eb', text:'#374151', port:'#2563eb', bench:'#d97706' } : chartColors();
  const pts = seriesFrom(snaps, startKey);
  return {
    type:'line',
    data:{ labels: pts.map(p => p.label || fmtKey(p.date).slice(0,5)),
      datasets:[
        { label:'Mijn portefeuille', data:pts.map(p => p.value), borderColor:col.port, backgroundColor:col.port + '22', fill:true, tension:.25, pointRadius:pts.length > 40 ? 0 : 3, borderWidth:2.5 },
        { label:'AEX-benchmark', data:pts.map(p => p.bench), borderColor:col.bench, borderDash:[6,4], fill:false, tension:.25, pointRadius:pts.length > 40 ? 0 : 2, borderWidth:2 }
      ]},
    options:{ responsive:!forPdf, maintainAspectRatio:false, animation:forPdf ? false : { duration:400 },
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ labels:{ color:col.text, boxWidth:14 } }, tooltip:{ callbacks:{ label: ctx => `${ctx.dataset.label}: ${fmtEUR(ctx.parsed.y)}` } } },
      scales:{ x:{ grid:{ color:col.grid }, ticks:{ color:col.text, maxRotation:0, autoSkip:true, maxTicksLimit:10 } },
               y:{ grid:{ color:col.grid }, ticks:{ color:col.text, callback: v => '€ ' + Number(v).toLocaleString('nl-NL') } } } }
  };
}
function pieConfig(labels, values, colors, forPdf=false){
  const col = forPdf ? { text:'#374151', border:'#ffffff' } : chartColors();
  const total = values.reduce((a,b) => a+b, 0) || 1;
  return { type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderColor:col.border, borderWidth:2 }] },
    options:{ responsive:!forPdf, maintainAspectRatio:false, animation:forPdf ? false : { duration:400 }, cutout:'55%',
      plugins:{ legend:{ position:'right', labels:{ color:col.text, boxWidth:12, font:{ size:11 }, generateLabels: ch => ch.data.labels.map((l,i) => ({ text:`${l} ${fmtNum(values[i]/total*100,1)}%`, fillStyle:colors[i], strokeStyle:colors[i], fontColor:col.text, index:i })) } },
        tooltip:{ callbacks:{ label: ctx => `${ctx.label}: ${fmtEUR(ctx.parsed)} (${fmtNum(ctx.parsed/total*100,1)}%)` } } } } };
}
function allocData(c){
  const sl = Object.entries(c.sectors).sort((a,b) => b[1]-a[1]);
  const sector = { labels:[...sl.map(x => x[0]), 'Cash'], values:[...sl.map(x => x[1]), S.cash], colors:[...sl.map(x => SECTOR_COLORS[x[0]] || '#64748b'), SECTOR_COLORS.Cash] };
  const stock = { labels:[...c.pos.map(p => p.name), 'Cash'], values:[...c.pos.map(p => p.value), S.cash], colors:[...c.pos.map(p => p.color), SECTOR_COLORS.Cash] };
  return { sector, stock };
}
function drawPortfolioCharts(){
  if (typeof Chart === 'undefined'){ document.querySelectorAll('.chart-box,.pie-box').forEach(el => el.innerHTML = '<div class="empty">Grafieken konden niet worden geladen (geen internet?).</div>'); return; }
  const c = compute();
  charts.line = new Chart($('#lineChart'), lineChartConfig(S.snapshots, S.player.startDate));
  const a = allocData(c);
  charts.sector = new Chart($('#sectorChart'), pieConfig(a.sector.labels, a.sector.values, a.sector.colors));
  charts.stock = new Chart($('#stockChart'), pieConfig(a.stock.labels, a.stock.values, a.stock.colors));
}

function openModal(html, opts={}){
  const root = $('#modalRoot');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  if (!opts.locked) ov.addEventListener('click', e => { if (e.target === ov) closeModal(ov); });
  root.appendChild(ov);
  ov.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(ov));
  document.body.style.overflow = 'hidden';
  return ov;
}
function closeModal(ov){ ov.remove(); if (!$('#modalRoot').children.length) document.body.style.overflow = ''; }
function showMessage(title, html){ openModal(`<div class="modal-head"><h2>${title}</h2><button class="close-x" data-close aria-label="Sluiten">×</button></div><div>${html}</div><div style="margin-top:16px"><button class="btn primary block" data-close>Oké</button></div>`); }

    <div class="qty"><button data-q="-1" aria-label="Minder">−</button><input id="tQty" type="number" inputmode="numeric" min="1" step="1" value="1"><button data-q="1" aria-label="Meer">+</button></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn small" data-q="5">+5</button><button class="btn small" data-q="10">+10</button><button class="btn small" id="tMax">Maximaal</button></div>
    <div class="hint" id="tAvail"></div>
    <div class="calc" id="tCalc"></div>
    <label class="f" for="tMot">Waarom doe je deze transactie? <span class="muted" style="font-weight:400">(verplicht)</span></label>
    <textarea id="tMot" placeholder="Bijv. nieuws, spreiding, winstnemen, verwachting over de sector…" maxlength="500"></textarea>
    <div class="counter" id="tCount"></div>
    <div class="err" id="tErr"></div>
    <button class="btn block" id="tConfirm" disabled>Bevestigen</button>
  `);
  let curSide = side;
  const qtyEl = $('#tQty', ov), motEl = $('#tMot', ov);
  const price = () => priceOf(t);
  const maxQty = () => {
    if (curSide === 'sell') return Math.max(0, (S.positions[t]?.qty || 0) - pendingSellQty(t));
    const ms = marketState();
    const willPend = STRICT_EURONEXT_HOURS && !ms.open;
    const pr = price() * (willPend ? 1 + PENDING_RESERVE_BUFFER : 1);
    let q = Math.floor(freeCash() / pr);
    while (q > 0 && round2(q*pr) + costFor(q*pr) > freeCash()) q--;
    return Math.max(0, q);
  };
  function update(){
    const ms = marketState();
    const willPend = STRICT_EURONEXT_HOURS && !ms.open;
    ov.querySelectorAll('[data-side]').forEach(b => b.className = b.dataset.side === curSide ? (curSide==='buy'?'on-buy':'on-sell') : '');
    const pr = price();
    $('#tPrice', ov).innerHTML = `${fmtEUR(pr)} <span class="${cls(S.prices[t]?.changePct||0)}">${fmtPct(S.prices[t]?.changePct||0)}</span>`;
    $('#tMarket', ov).innerHTML = ms.open ? `<div class="banner ok"><div class="grow">Beurs open: je order wordt <b>direct uitgevoerd</b> tegen de actuele koers.</div></div>`
      : willPend ? `<div class="banner warn"><div class="grow">Beurs gesloten (${ms.detail}). Je order wordt een <b>lopende order</b> en wordt uitgevoerd tegen de nieuwe koers zodra de beurs opent. De koers kan dan anders zijn!</div></div>`
      : `<div class="banner warn"><div class="grow">Beurs gesloten – je order wordt direct uitgevoerd tegen de laatste slotkoers.</div></div>`;
    let q = parseInt(qtyEl.value, 10); if (!isFinite(q)) q = 0;
    const value = round2(q * pr), costs = q > 0 ? costFor(value) : 0;
    const total = curSide === 'buy' ? round2(value + costs) : round2(value - costs);
    const reserve = willPend && curSide === 'buy' ? round2(value * (1 + PENDING_RESERVE_BUFFER) + costFor(value * (1 + PENDING_RESERVE_BUFFER))) : null;
    $('#tAvail', ov).textContent = curSide === 'buy' ? `Vrij cash: ${fmtEUR(freeCash())} · maximaal ${maxQty()} stuks` : `In bezit (beschikbaar): ${maxQty()} stuks`;
    $('#tCalc', ov).innerHTML = `
      <div class="row"><span>${q} × ${fmtEUR(pr)}${willPend ? ' (indicatie)' : ''}</span><span>${fmtEUR(value)}</span></div>
      <div class="row"><span>Transactiekosten (${fmtEUR(COST_FIXED)} + ${String(COST_PERCENT).replace('.',',')}%) ${infoBtn('costs')}</span><span>${curSide==='buy'?'+':'−'} ${fmtEUR(costs)}</span></div>
      <div class="row total"><span>${curSide === 'buy' ? 'Totaal te betalen' : 'Netto-opbrengst'}</span><span>${fmtEUR(total)}</span></div>
      ${reserve !== null ? `<div class="row small muted"><span>Tijdelijk geblokkeerd (incl. ${PENDING_RESERVE_BUFFER*100}% buffer)</span><span>${fmtEUR(reserve)}</span></div>` : ''}
      ${q > 0 ? `<div class="row small muted"><span>Kosten als % van order</span><span>${fmtNum(costs/Math.max(value,0.01)*100)}%</span></div>` : ''}`;
    const mot = motEl.value.trim();
    $('#tCount', ov).textContent = `${mot.length} / minimaal ${MIN_MOTIVATION} tekens`;
    let err = '';
    if (S.source !== 'sim' && S.prices[t] && S.prices[t].live === false) err = 'Voor dit aandeel is nu geen actuele koers beschikbaar. Handelen kan weer zodra de koers binnenkomt.';
    else if (!(q >= 1) || String(qtyEl.value).includes('.') || String(qtyEl.value).includes(',')) err = 'Vul een heel aantal aandelen in (minimaal 1).';
    else if (curSide === 'buy' && (reserve ?? total) > freeCash()) err = 'Niet genoeg vrij cash. Kopen op krediet is niet toegestaan.';
    else if (curSide === 'sell' && q > maxQty()) err = maxQty() === 0 ? 'Je hebt geen (vrije) aandelen om te verkopen. Short gaan is niet toegestaan.' : `Je kunt maximaal ${maxQty()} stuks verkopen.`;
    const errEl = $('#tErr', ov);
    errEl.textContent = err;
    const okMot = mot.length >= MIN_MOTIVATION;
    const btn = $('#tConfirm', ov);
    btn.disabled = !!err || !okMot;
    btn.className = 'btn block ' + (curSide === 'buy' ? 'buy' : 'sell');
    btn.textContent = (willPend ? 'Lopende order inleggen: ' : 'Bevestig ') + (curSide === 'buy' ? `koop ${q > 0 ? q : ''} ${s.name}` : `verkoop ${q > 0 ? q : ''} ${s.name}`);
  }
  ov.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { curSide = b.dataset.side; if (curSide==='sell' && +qtyEl.value > maxQty()) qtyEl.value = Math.max(1, maxQty()); update(); });
  ov.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const v = Math.max(1, (parseInt(qtyEl.value,10)||0) + Number(b.dataset.q)); qtyEl.value = v; update(); });
  $('#tMax', ov).onclick = () => { qtyEl.value = Math.max(1, maxQty()); update(); };
  qtyEl.oninput = update; motEl.oninput = update;
  $('#tConfirm', ov).onclick = () => { confirmTrade(t, curSide, parseInt(qtyEl.value,10), motEl.value.trim()); closeModal(ov); };
  if (side === 'buy' && !(S.positions[t]?.qty)) curSide = 'buy';
  update();
}

function confirmTrade(t, side, qty, motivation){
  if (!(qty >= 1) || motivation.length < MIN_MOTIVATION) return;
  const s = stockBy(t);
  const ms = marketState();
  const price = priceOf(t);
  if (!ms.open && STRICT_EURONEXT_HOURS){
    const value = qty * price;
    const reserve = side === 'buy' ? round2(value * (1 + PENDING_RESERVE_BUFFER) + costFor(value * (1 + PENDING_RESERVE_BUFFER))) : 0;
    if (side === 'buy' && reserve > freeCash()) return toast('Niet genoeg vrij cash');
    if (side === 'sell' && qty > (S.positions[t]?.qty || 0) - pendingSellQty(t)) return toast('Niet genoeg aandelen');
    S.pending.push({ id:uid(), ts:new Date().toISOString(), side, ticker:t, name:s.name, qty, estPrice:price, reserve, motivation });
    save(); render();
    showMessage('Lopende order ingelegd', `<p>Je ${side==='buy'?'kooporder':'verkooporder'} voor <b>${qty}× ${escapeHtml(s.name)}</b> staat klaar en wordt uitgevoerd zodra Euronext Amsterdam opent (${ms.detail}).</p><p class="small muted">Status: "Lopende order (in afwachting van beursopening)". Je kunt hem tot die tijd annuleren in je Portefeuille.</p>`);
    return;
  }
  const note = !ms.open ? 'Beurs gesloten – uitgevoerd tegen slotkoers' : '';
  let tx;
  if (side === 'buy'){
    const value = round2(qty * price);
    if (round2(value + costFor(value)) > freeCash()) return toast('Niet genoeg vrij cash');
    tx = doBuy(t, qty, price, motivation, note);
  } else {
    if (qty > (S.positions[t]?.qty || 0) - pendingSellQty(t)) return toast('Niet genoeg aandelen');
    tx = doSell(t, qty, price, motivation, note);
  }
  updateSnapshot(); save(); render();
  toast((note ? note + ': ' : '') + `${tx.type} ${qty}× ${s.name} à ${fmtEUR(price)} uitgevoerd`);
}
function cancelPending(id){
  const o = S.pending.find(x => x.id === id); if (!o) return;
  const ov = openModal(`<div class="modal-head"><h2>Order annuleren?</h2><button class="close-x" data-close>×</button></div>
    <p>${o.side==='buy'?'Kooporder':'Verkooporder'} ${o.qty}× ${escapeHtml(o.name)} annuleren?${o.side==='buy' ? ` Het geblokkeerde bedrag (${fmtEUR(o.reserve)}) komt weer vrij.` : ''}</p>
    <div class="btn-row"><button class="btn" data-close style="flex:1">Nee</button><button class="btn sell" id="cYes" style="flex:1">Ja, annuleren</button></div>`);
  $('#cYes', ov).onclick = () => { S.pending = S.pending.filter(x => x.id !== id); save(); closeModal(ov); render(); toast('Order geannuleerd'); };
}

function safeName(){ const p = S.player; return [p.first, p.last].join('_').replace(/\s+/g,'_').replace(/[^\p{L}\p{N}_-]/gu,''); }
function csvFilename(){ return `AEX_Week${gameWeek()}_${safeName()}_${S.player.klas.replace(/[^\p{L}\p{N}-]/gu,'')}.csv`; }
const csvNum = (n, d=2) => (isFinite(n) ? n : 0).toFixed(d).replace('.', ',');
const csvCell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
function buildCSV(){
  const c = compute(), p = S.player, L = [];
  const row = (...a) => L.push(a.map(csvCell).join(';'));
  row('AEX Beleggingsgame – weekexport');
  row('Voornaam', p.first); row('Achternaam', p.last); row('Klas', p.klas); row('Speler-ID', p.id);
  row('Startdatum', fmtKey(p.startDate)); row('Exportdatum', fmtDateTime(new Date())); row('Weeknummer', gameWeek()); row('Speldag', gameDay());
  row('Koersbron', { live:'Live (Google Finance, max. ~20 min vertraagd)', sim:'Simulatie', cache:'Laatst bekende koersen' }[S.source]);
  row('Laatste koersupdate', S.lastUpdate ? fmtDateTime(S.lastUpdate) : '-');
  row('');
  row('KERNCIJFERS', 'Waarde');
  row('Startkapitaal (€)', csvNum(START_CAPITAL));
  row('Totale portefeuillewaarde (€)', csvNum(c.total));
  row('Waarde aandelen (€)', csvNum(c.stockValue));
  row('Cash totaal (€)', csvNum(S.cash));
  row('Vrij cash (€)', csvNum(c.cashFree));
  row('Totaal rendement (€)', csvNum(c.ret));
  row('Totaal rendement (%)', csvNum(c.retPct));
  row('Dagresultaat (€)', csvNum(c.dayRes));
  row('Gerealiseerd resultaat (€)', csvNum(c.realized));
  row('Ongerealiseerd resultaat (€)', csvNum(c.unrealized));
  row('Totaal betaalde transactiekosten (€)', csvNum(c.costs));
  row('Aantal transacties', S.transactions.length);
  row('');
  row('AEX-BENCHMARK', 'Waarde');
  row('Waarde € ' + START_CAPITAL + ' in AEX (€)', csvNum(c.benchValue));
  row('Rendement AEX (%)', csvNum(c.benchPct));
  row('Verschil portefeuille t.o.v. AEX (procentpunt)', csvNum(c.diffPP));
  row('Resultaat', c.diffPP >= 0 ? 'Verslaat de AEX' : 'Blijft achter bij de AEX');
  row('');
  row('POSITIES');
  row('Aandeel', 'Ticker', 'Sector', 'Aantal', 'GAK (€)', 'Koers (€)', 'Waarde (€)', 'Ongerealiseerd (€)', 'Ongerealiseerd (%)', 'Weging (%)');
  c.pos.forEach(x => row(x.name, x.ticker, x.sector, x.qty, csvNum(x.avg, 4), csvNum(x.price), csvNum(x.value), csvNum(x.unr), csvNum(x.unrPct), csvNum(x.value / c.total * 100)));
  row('Cash', '', '', '', '', '', csvNum(S.cash), '', '', csvNum(S.cash / c.total * 100));
  row('');
  row('SECTORSPREIDING');
  row('Sector', 'Waarde (€)', 'Weging (%)');
  Object.entries(c.sectors).sort((a,b) => b[1]-a[1]).forEach(([k,v]) => row(k, csvNum(v), csvNum(v / c.total * 100)));
  row('Cash', csvNum(S.cash), csvNum(S.cash / c.total * 100));
  row('');
  row('TRANSACTIEGESCHIEDENIS');
  row('Datum', 'Tijd', 'Type', 'Aandeel', 'Ticker', 'Aantal', 'Koers (€)', 'Orderwaarde (€)', 'Transactiekosten (€)', 'Netto bedrag (€)', 'Gerealiseerd (€)', 'Motivatie', 'Opmerking');
  S.transactions.forEach(t => { const dt = fmtDateTime(t.ts).split(' '); row(dt[0].replace(',',''), dt[1] || '', t.type, t.name, t.ticker, t.qty, csvNum(t.price), csvNum(t.value), csvNum(t.costs), csvNum(t.net), t.type==='Verkoop' ? csvNum(t.realized) : '', t.motivation, t.note); });
  if (S.pending.length){
    row(''); row('LOPENDE ORDERS');
    row('Ingelegd', 'Type', 'Aandeel', 'Aantal', 'Indicatiekoers (€)', 'Geblokkeerd (€)', 'Motivatie');
    S.pending.forEach(o => row(fmtDateTime(o.ts), o.side==='buy'?'Koop':'Verkoop', o.name, o.qty, csvNum(o.estPrice), csvNum(o.reserve), o.motivation));
  }
  if (S.frozen){
    const f = S.frozen;
    row(''); row('BEVROREN PO-EINDSTAND (DAG ' + GAME_DAYS + ')');
    row('Vastgelegd op', fmtDateTime(f.frozenAt)); row('Eindwaarde (€)', csvNum(f.total)); row('Rendement (%)', csvNum(f.retPct));
    row('AEX-rendement (%)', csvNum(f.benchPct)); row('Verschil (pp)', csvNum(f.diffPP)); row('Transactiekosten (€)', csvNum(f.costs));
  }
  row('');
  row('DAGELIJKSE SNAPSHOTS');
  row('Datum', 'Portefeuillewaarde (€)', 'AEX-benchmark (€)');
  S.snapshots.forEach(s => row(fmtKey(s.date), csvNum(s.value), csvNum(s.bench)));
  return L.join('\r\n');
}

async function shareFile(blob, filename, title){
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title });
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError') return; // gebruiker annuleerde
    console.warn('Delen mislukt, val terug op downloaden', e);
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Bestand gedownload: ' + filename);
}

$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const st = data.state || data;
    if (!st.player || !Array.isArray(st.transactions) || typeof st.cash !== 'number') throw new Error('Geen geldig back-upbestand');
    const ov = openModal(`<div class="modal-head"><h2>Back-up terugzetten?</h2><button class="close-x" data-close>×</button></div>
      <p>Back-up van <b>${escapeHtml(st.player.first)} ${escapeHtml(st.player.last)}</b> (${escapeHtml(st.player.klas)}), gemaakt op ${data.exported ? fmtDateTime(data.exported) : 'onbekend'}, met ${st.transactions.length} transacties.</p>
      <p class="small muted">Je huidige voortgang op dit apparaat wordt hierdoor vervangen.</p>
      <div class="btn-row"><button class="btn" data-close style="flex:1">Annuleren</button><button class="btn primary" id="impYes" style="flex:1">Terugzetten</button></div>`);
    $('#impYes', ov).onclick = () => { S = Object.assign(defaultState(), st); save(); closeModal(ov); render(); toast('Back-up teruggezet'); refreshPrices(); };
  } catch(err){ showMessage('Importeren mislukt', `<p>${escapeHtml(err.message)}</p>`); }
});

function makeChartImage(cfg, w, h){
  if (typeof Chart === 'undefined') return null;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px`;
  document.body.appendChild(cv);
  cfg.options.devicePixelRatio = 2;
  cfg.options.plugins = cfg.options.plugins || {};
  const ch = new Chart(cv, cfg);
  // witte achtergrond
  const ctx = cv.getContext('2d'); ctx.save(); ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore();
  const url = cv.toDataURL('image/png');
  ch.destroy(); cv.remove();
  return url;
}

      <h3>Posities</h3>
      <div class="table-wrap"><table><thead><tr><th>Aandeel</th><th class="num">Aantal</th><th class="num">GAK</th><th class="num">Koers</th><th class="num">Waarde</th><th class="num">Ongerealiseerd</th></tr></thead><tbody>${posRows}</tbody></table></div>
      <h3>Transacties ${kind === 'final' ? '(volledige PO-periode)' : '(afgelopen 7 dagen)'}</h3>
      <div class="table-wrap"><table><thead><tr><th>Datum</th><th>Type</th><th>Aandeel</th><th class="num">Aantal</th><th class="num">Koers</th><th class="num">Kosten</th><th class="num">Netto</th><th>Motivatie</th></tr></thead><tbody>${txRows}</tbody></table></div>
    </div>`, { wide:true });
  $('#rPrint', ov).onclick = () => window.print();
  $('#rPdf', ov).onclick = async () => {
    const btn = $('#rPdf', ov); btn.disabled = true; btn.textContent = 'PDF maken…';
    try { const blob = await buildPdf(d, chartImg); await shareFile(blob, `AEX_${kind==='final' ? 'PO-eindrapport' : 'Week' + gameWeek()}_${safeName()}_${S.player.klas.replace(/[^\p{L}\p{N}-]/gu,'')}.pdf`, d.title); }
    catch(e){ showMessage('PDF maken mislukt', `<p>${escapeHtml(e.message)}</p><p>Gebruik de knop "Afdrukken / bewaar als PDF".</p>`); }
    btn.disabled = false; btn.textContent = 'Deel als PDF (AirDrop)';
  };
}

async function buildPdf(d, chartImg){
  await loadPdfLibs();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const clean = s => String(s ?? '').replace(/[  ]/g, ' ');
  const E = n => clean(fmtEUR(n)), SE = n => clean(fmtSignedEUR(n));
  const p = S.player;
  doc.setFillColor(11,27,58); doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(clean('AEX Beleggingsgame – ' + d.title), 14, 13);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(clean(`${p.first} ${p.last} · klas ${p.klas} · speler-ID ${p.id}`), 14, 20);
  doc.text(clean(`Periode: ${d.period} · gemaakt op ${fmtDateTime(d.generated)}`), 14, 25);
  doc.setTextColor(0,0,0);
  const head = { fillColor:[37,99,235], textColor:255, fontStyle:'bold' };
  doc.autoTable({ startY:34, head:[['Kerncijfer','Waarde']], headStyles:head, theme:'striped', styles:{ fontSize:10 }, columnStyles:{ 1:{ halign:'right' } }, margin:{ left:14, right:110 },
    body:[['Portefeuillewaarde', E(d.total)], ['Totaal rendement', `${SE(d.ret)} (${clean(fmtPct(d.retPct))})`], ['Cash', E(d.cash)], ['Gerealiseerd', SE(d.realized)], ['Ongerealiseerd', SE(d.unrealized)], ['Transactiekosten', E(d.costs)], ['Aantal transacties', String(d.txCountAll)]] });
  doc.autoTable({ startY:34, head:[['AEX-vergelijking','']], headStyles:head, theme:'striped', styles:{ fontSize:10 }, columnStyles:{ 1:{ halign:'right' } }, margin:{ left:106, right:14 },
    body:[['AEX-benchmark', E(d.benchValue)], ['Rendement AEX', clean(fmtPct(d.benchPct))], ['Mijn rendement', clean(fmtPct(d.retPct))], ['Verschil', `${d.diffPP>=0?'+':''}${clean(fmtNum(d.diffPP))} pp`], ['Conclusie', d.diffPP >= 0 ? 'Verslaat de AEX' : 'Blijft achter']] });
  let y = Math.max(doc.lastAutoTable.finalY, 90) + 6;
  if (chartImg){ doc.addImage(chartImg, 'PNG', 14, y, 182, 72); y += 78; }
  const total = d.total || 1;
  const ny = yy => { if (yy > 255){ doc.addPage(); return 18; } return yy; };
  doc.autoTable({ startY:ny(y), head:[['Sector','Waarde','Weging']], headStyles:head, styles:{ fontSize:9 }, columnStyles:{ 1:{ halign:'right' }, 2:{ halign:'right' } },
    body:[...Object.entries(d.sectors).sort((a,b) => b[1]-a[1]).map(([k,v]) => [k, E(v), clean(fmtNum(v/total*100,1)) + '%']), ['Cash', E(d.cash), clean(fmtNum(d.cash/total*100,1)) + '%']] });
  doc.autoTable({ startY:ny(doc.lastAutoTable.finalY + 6), head:[['Aandeel','Sector','Aantal','GAK','Koers','Waarde','Ongerealiseerd']], headStyles:head, styles:{ fontSize:9 },
    columnStyles:{ 2:{ halign:'right' }, 3:{ halign:'right' }, 4:{ halign:'right' }, 5:{ halign:'right' }, 6:{ halign:'right' } },
    body: d.pos.length ? d.pos.map(x => [x.name, x.sector, String(x.qty), E(x.avg), E(x.price), E(x.value), SE(x.unr)]) : [['Geen posities','','','','','','']] });
  doc.autoTable({ startY:ny(doc.lastAutoTable.finalY + 6), head:[['Datum','Type','Aandeel','Aantal','Koers','Kosten','Netto','Motivatie']], headStyles:head, styles:{ fontSize:8, cellPadding:1.5 },
    columnStyles:{ 0:{ cellWidth:24 }, 3:{ halign:'right' }, 4:{ halign:'right' }, 5:{ halign:'right' }, 6:{ halign:'right' }, 7:{ cellWidth:55 } },
    body: d.tx.length ? d.tx.map(t => [clean(fmtDateTime(t.ts)), t.type, t.name, String(t.qty), E(t.price), E(t.costs), SE(t.net), clean(t.motivation + (t.note ? ' (' + t.note + ')' : ''))]) : [['Geen transacties in deze periode','','','','','','','']] });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(`Pagina ${i} van ${n} · AEX Beleggingsgame`, 105, 290, { align:'center' }); }
  return doc.output('blob');
}

/* =====================================================================
   ONBOARDING
   ===================================================================== */
function genPlayerId(){ const a = new Uint8Array(6); crypto.getRandomValues(a); const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const s = Array.from(a, b => c[b % c.length]).join(''); return `AEX-${s.slice(0,3)}-${s.slice(3)}`; }
function onboarding(){
  const ov = openModal(`
    <div class="modal-head"><h2>Welkom bij de AEX Beleggingsgame 📈</h2></div>
    <p>Je krijgt <b>${fmtEUR(START_CAPITAL)}</b> virtueel startkapitaal. Beleg ${GAME_DAYS} dagen lang in de bedrijven van de AEX en probeer de AEX-index te verslaan. Bij elke transactie leg je uit <i>waarom</i>.</p>
    <label class="f" for="obFirst">Voornaam</label><input class="f" id="obFirst" autocomplete="given-name">
    <label class="f" for="obLast">Achternaam</label><input class="f" id="obLast" autocomplete="family-name">
    <label class="f" for="obKlas">Klas</label><input class="f" id="obKlas" placeholder="bijv. 4H2" autocapitalize="characters">
    <div class="err" id="obErr"></div>
    <button class="btn primary block" id="obGo" style="margin-top:8px">Start het spel</button>
    <p class="small muted" style="margin-top:12px">Al eerder gespeeld op een ander apparaat? <button class="btn ghost small" id="obImport" style="min-height:44px;padding:0 6px;color:var(--accent)">Zet een back-up terug</button></p>
  `, { locked:true });
  $('#obImport', ov).onclick = () => { closeModal(ov); $('#importFile').click(); setTimeout(() => { if (!S.player) onboarding(); }, 60000); };
  $('#obGo', ov).onclick = () => {
    const first = $('#obFirst', ov).value.trim(), last = $('#obLast', ov).value.trim(), klas = $('#obKlas', ov).value.trim().toUpperCase();
    if (!first || !last || !klas) { $('#obErr', ov).textContent = 'Vul je voornaam, achternaam en klas in.'; return; }
    S = defaultState();
    S.player = { id:genPlayerId(), first, last, klas, startDate: FIXED_START_DATE || ams().key, createdAt:new Date().toISOString() };
    save(); closeModal(ov); render(); refreshPrices();
  };
}

/* =====================================================================
   APP-ICOON & START
   ===================================================================== */
function makeIcon(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,180,180); g.addColorStop(0,'#0b1b3a'); g.addColorStop(1,'#2563eb');
    x.fillStyle = g; x.fillRect(0,0,180,180);
    x.strokeStyle = '#4ade80'; x.lineWidth = 12; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(30,125); x.lineTo(70,85); x.lineTo(100,108); x.lineTo(150,50); x.stroke();
    x.fillStyle = '#fff'; x.font = 'bold 34px -apple-system,Helvetica,Arial'; x.textAlign = 'center'; x.fillText('AEX', 90, 160);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
    const f = document.createElement('link'); f.rel = 'icon'; f.href = l.href; document.head.appendChild(f);
  } catch(e){}
}

function tick(){
  if (!S || !S.player) return;
  renderHeader();
  const now = Date.now();
  const last = S.lastUpdate ? new Date(S.lastUpdate).getTime() : 0;
  const ms = marketState();
  const needPending = S.pending.length && pendingExecutableNow() && (!S.lastRefreshWasOpen || ams(new Date(last)).key !== ms.key || ams(new Date(last)).min < OPEN_MIN + (DATA_ENDPOINT_URL ? PENDING_EXEC_DELAY_MIN : 0));
  if (now - last >= REFRESH_INTERVAL_MIN * 60000 || needPending) refreshPrices();
  else { const before = !!S.frozen; checkFreeze(); if (!before && S.frozen) render(); }
}

function init(){
  makeIcon();
  S = load();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { currentTab = b.dataset.tab; render(); window.scrollTo(0,0); });
  $('#refreshBtn').onclick = () => refreshPrices(true);
  render();
  if (!S.player) onboarding();
  else refreshPrices();
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
}
init();
</script>
